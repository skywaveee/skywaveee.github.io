name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - benchdecoded-updated
      - mindspace-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout BenchDecoded content
        uses: actions/checkout@v4
        with:
          repository: skywaveee/benchdecoded
          path: external/benchdecoded

      - name: Checkout Mindspace public content
        id: mindspace
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: skywaveee/mindspace
          ref: main
          path: external/mindspace

      - name: Explain Mindspace snapshot fallback
        if: steps.mindspace.outcome != 'success'
        run: echo "Mindspace checkout unavailable; building the committed public snapshot."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          MINDSPACE_SOURCE: ${{ steps.mindspace.outcome == 'success' && format('{0}/external/mindspace', github.workspace) || '' }}
          BENCHDECODED_SOURCE: ${{ github.workspace }}/external/benchdecoded
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
